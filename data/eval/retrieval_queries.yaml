      insurer: samsunglife
      product_type: whole_life
    expected_any_section_titles:
      - "제22조 [계약의 소멸]"
    top_k: 5

  - id: samsung_whole_life_policy_loan
    query: "보험계약대출은 어떻게 돼?"
    filters:
      insurer: samsunglife
      product_type: whole_life
    expected_any_section_titles:
      - "제33조 [보험계약대출]"
    top_k: 5

  - id: samsung_whole_life_material_breach
    query: "중대사유로 인한 해지는 어떻게 돼?"
    filters:
      insurer: samsunglife
      product_type: whole_life
    expected_any_section_titles:
      - "제30조 [중대사유로 인한 해지]"
      - "제21조 [중대사유로 인한 해지]"
    top_k: 5

  # --- Mirae Asset Life — 변액연금보험 ---
  - id: mirae_variable_special_account_abolition
    query: "특별계정 폐지는 언제 가능해?"
    filters:
      insurer: miraeassetlife
      product_type: variable_annuity
    expected_any_section_titles:
      - "제45조 (특별계정의 폐지)"
    top_k: 5

  - id: mirae_variable_fund_operation
    query: "펀드의 운용과 평가는 어떻게 돼?"
    filters:
      insurer: miraeassetlife
      product_type: variable_annuity
    expected_any_section_titles:
      - "제35조 (펀드의 운용 및 평가)"
    top_k: 5

  - id: mirae_variable_surrender_value
    query: "해약환급금은 어떻게 계산돼?"
    filters:
      insurer: miraeassetlife
      product_type: variable_annuity
    expected_any_section_titles:
      - "제20조 (해약환급금)"
      - "제50조 (해약환급금)"
    top_k: 5
