# Curated deterministic retrieval evaluation queries (Phase 2F harness).
# Run: uv run python -m insurance_ai_retrieval.evaluate_retrieval \
#   --index-dir data/processed/index \
#   --queries data/eval/retrieval_queries.yaml \
#   --report-path data/processed/reports/retrieval_eval.md

queries:
  # --- Kyobo Life — 개인연금저축 교보로연금보험 (적립형) ---
  - id: kyobo_annuity_cancellation
    query: "청약 철회는 언제까지 가능해?"
    filters:
      insurer: kyobolife
      product_type: annuity
      variant_name: 적립형
    expected_any_section_titles:
      - "제15조 (청약의철회)"
    top_k: 5

  - id: kyobo_annuity_disclosure_violation
    query: "계약 전 알릴 의무를 위반하면 어떻게 돼?"
    filters:
      insurer: kyobolife
      product_type: annuity
      variant_name: 적립형
    expected_any_section_titles:
      - "제12조 (계약전알릴의무위반의효과)"
      - "제11조 (계약전알릴의무)"
    top_k: 5

  - id: kyobo_annuity_surrender_value
    query: "해약환급금은 어떻게 계산되고 언제 지급돼?"
    filters:
      insurer: kyobolife
      product_type: annuity
      variant_name: 적립형
    expected_any_section_titles:
      - "제28조 (해약환급금)"
      - "제33조 (해약환급금)"
    top_k: 5

  - id: kyobo_annuity_payment_criteria_table
    query: "연금 지급 기준표는 어디에 있어?"
    filters:
      insurer: kyobolife
      product_type: annuity
      variant_name: 적립형
    expected_any_section_titles:
      - "( 별표 1 )"
    expected_any_section_types:
      - appendix
    top_k: 5

  - id: kyobo_annuity_policy_loan
    query: "보험계약대출은 어떻게 받을 수 있어?"
    filters:
      insurer: kyobolife
      product_type: annuity
      variant_name: 적립형
    expected_any_section_titles:
      - "제34조 (보험계약대출)"
      - "제29조 (보험계약대출)"
    top_k: 5

  # --- Samsung Life — 인터넷암보험 ---
  - id: samsung_cancer_non_payment_reasons
    query: "보험금을 지급하지 않는 사유는 뭐야?"
    filters:
      insurer: samsunglife
      product_type: cancer
    expected_any_section_titles:
      - "제5조 [보험금을 지급하지 않는 사유]"
    top_k: 5

  - id: samsung_cancer_cancellation
    query: "청약 철회는 언제까지 가능해?"
    filters:
      insurer: samsunglife
      product_type: cancer
    expected_any_section_titles:
      - "제17조 [청약의 철회]"
    top_k: 5

  - id: samsung_cancer_diagnosis_criteria
    query: "암 진단은 어떤 기준으로 확정돼?"
    filters:
      insurer: samsunglife
      product_type: cancer
    expected_any_section_titles:
      - "제2조 의2 [“암”등의 정의 및 진단 확정]"
      - "제2조 의4 [“암” 등의 정의 및 진단 확정]"
      - "제2조 의4 [“고액치료비암”의 정의 및 진단 확정]"
      - "제2조 의5 [“제자리암”의 정의 및 진단 확정]"
      - "제2조 의7 [“대장점막내암”의 정의 및 진단 확정]"
      - "제2조 의10 [AJCC 암병기설정매뉴얼 관련 유의사항]"
      - "제2조 의14 [AJCC 암병기설정매뉴얼 관련 유의사항]"
      - "제2조 의7 [AJCC 암병기설정매뉴얼 관련 유의사항]"
    top_k: 5

  - id: samsung_cancer_claim_documents
    query: "보험금 청구할 때 어떤 서류가 필요해?"
    filters:
      insurer: samsunglife
      product_type: cancer
    expected_any_section_titles:
      - "제6조 [보험금의 청구]"
      - "제7조 [보험금의 청구]"
      - "제4조 [보험금의 청구]"
    top_k: 5

  # --- Samsung Life — 밸런스종신보험 ---
  - id: samsung_whole_life_contract_extinction
    query: "계약의 소멸은 어떤 경우야?"
