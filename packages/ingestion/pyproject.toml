[project]
name = "insurance-ai-ingestion"
version = "0.1.0"
description = "Document ingestion and normalization (PDF to processed JSON)."
requires-python = ">=3.12"
dependencies = [
    "insurance-ai-shared",
    "pymupdf>=1.24",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
insurance-ai-shared = { workspace = true }
