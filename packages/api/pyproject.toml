[project]
name = "insurance-ai-api"
version = "0.1.0"
description = "Minimal FastAPI service: citation-ready retrieval context (no LLM)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "insurance-ai-retrieval",
]

[project.scripts]
insurance-ai-api = "insurance_ai_api.__main__:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
insurance-ai-retrieval = { workspace = true }
