[project]
name = "insurance-ai-retrieval"
version = "0.1.0"
description = "Local retrieval baselines and search utilities."
requires-python = ">=3.12"
dependencies = [
    "insurance-ai-shared",
    "numpy>=2.1",
    "pyyaml>=6",
    "sentence-transformers>=3.1",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
insurance-ai-shared = { workspace = true }
