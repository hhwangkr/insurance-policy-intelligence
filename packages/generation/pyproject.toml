[project]
name = "insurance-ai-generation"
version = "0.1.0"
description = "Grounded prompt construction, provider-agnostic LLM contract, and answer validation (mock providers only until real SDKs are wired)."
requires-python = ">=3.12"
dependencies = [
    "insurance-ai-retrieval",
    "insurance-ai-shared",
    "pydantic>=2.10",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
insurance-ai-retrieval = { workspace = true }
insurance-ai-shared = { workspace = true }
