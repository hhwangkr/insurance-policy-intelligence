[project]
name = "insurance-policy-intelligence"
version = "0.1.0"
description = "Monorepo workspace root for the insurance policy intelligence platform."
readme = "README.md"
requires-python = ">=3.12"

[tool.uv]
managed = true

[tool.uv.sources]
insurance-ai-api = { workspace = true }
insurance-ai-ingestion = { workspace = true }
insurance-ai-retrieval = { workspace = true }
insurance-ai-shared = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/api",
    "packages/shared",
    "packages/evaluation",
    "packages/retrieval",
    "packages/ingestion",
]

[dependency-groups]
dev = [
    "annotated-doc>=0.0.4",
    "httpx>=0.28",
    "insurance-ai-api",
    "insurance-ai-ingestion",
    "insurance-ai-retrieval",
    "insurance-ai-shared",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pydantic>=2.10",
    "pymupdf>=1.24",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pyyaml>=6",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "packages/api/tests",
    "scripts/tests",
    "packages/ingestion/tests",
    "packages/retrieval/tests",
]
pythonpath = [
    "packages/api/src",
    "scripts",
    "packages/shared/src",
    "packages/ingestion/src",
    "packages/retrieval/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/api/src",
    "packages/shared/src",
    "packages/evaluation/src",
    "packages/retrieval/src",
    "packages/ingestion/src",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"scripts/tests/**" = ["S101"]
"**/config/settings.py" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = [
    "packages/api/src",
    "packages/shared/src",
    "packages/evaluation/src",
    "packages/retrieval/src",
    "packages/ingestion/src",
    "scripts/staging_lib.py",
    "scripts/stage_manual_pdf.py",
    "scripts/metadata_models.py",
    "scripts/rule_extraction.py",
    "scripts/inbox_staging.py",
    "scripts/stage_manual_inbox.py",
]
mypy_path = [
    "packages/api/src",
    "packages/api/tests",
    "packages/shared/src",
    "packages/evaluation/src",
    "packages/retrieval/src",
    "packages/retrieval/tests",
    "packages/ingestion/src",
    "scripts",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "opentelemetry_exporter.*", "opentelemetry_instrumentation.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "transformers.*"]
ignore_missing_imports = true
